; Signal K steel gauges -- Waveshare ESP32-P4-WIFI6-Touch-LCD-4C (SKU 31522)
;
; 4" round 720x720 IPS (JD9365, 2-lane MIPI-DSI), GT911-compatible touch,
; ESP32-P4 (32 MB PSRAM, 32 MB flash) with an ESP32-C6 as its WiFi 6
; co-processor over SDIO (esp-hosted; Arduino's WiFi.h drives it).
;
; One environment for the board, p4: both sides run the same firmware
; (see [env:p4] below). The first flash of a unit is over USB; after
; that, over WiFi.
;
;   pio run -e p4                                  # build
;   pio run -e p4 -t upload --upload-port COM3     # flash over USB
;   pio run -e p4 -t upload --upload-port port     # flash the 4" port unit over WiFi

[platformio]
default_envs = p4
; Compiled objects, shared by every env and project in the repo (and by
; clean builds): a file is recompiled only when it or its flags change.
; Gitignored; CI points PLATFORMIO_BUILD_CACHE_DIR at the same place.
build_cache_dir = ../.pio-build-cache

[env]
; pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5), for its
; ESP-Hosted 2.12.13: 2.12.11 (3.3.11) never noticed a dead SDIO link to the
; C6 (esp-hosted-mcu #220), and both units lost it every 6-7 h. The C6 must
; run the same ESP-Hosted version (README, "Update the WiFi chip's
; firmware"). Needs PlatformIO Core 6.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
; ESP32-P4 silicon v3.01+, which Waveshare's examples target by default
; (Arduino "Chip Variant: v3.00 or newer"). For an early board with pre-v3
; silicon use `board = esp32-p4` instead.
board = esp32-p4_r3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 32MB
board_build.partitions = partitions_32MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    ; SensESP from the maintainer's fork: SignalK/SensESP main plus the fixes
    ; these gauges need that are not upstream yet (fix/ws-message-reassembly:
    ; received WebSocket messages joined before parsing). Back to
    ; https://github.com/SignalK/SensESP.git once they are merged. Unpinned
    ; like upstream main: record the resolved revision from the build log
    ; when a build matters.
    https://github.com/KEGustafsson/SensESP.git#fix/ws-message-reassembly
    ; ESP-IDF 5 no longer bundles the WebSocket client SensESP needs.
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    lvgl/lvgl @ 9.3.0
    SignalKGauges=symlink://../common

build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    ; Use the ESP-IDF logging library - required by SensESP.
    -D USE_ESP_IDF_LOG
    -D BOARD_HAS_PSRAM
    ; Serial over the USB-C port's USB Serial/JTAG, as in Waveshare's
    ; Arduino setup (USB Mode: Hardware CDC and JTAG, CDC On Boot: Enabled).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL: lv_conf.h from this project's include/.
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; secrets.h (shared by both projects) lives in ../include.
    -I ../include
    ; The display/touch/backlight description is
    ; include/esp_panel_board_custom_conf.h (picked up automatically).
    ; The LVGL draw buffer's size is set in src/main.cpp (a flag here would
    ; recompile everything when it changes).

build_unflags =
    -Werror=reorder

; OTA password and target address from ../include/secrets.h.
extra_scripts =
    pre:../scripts/fast_scons.py
    pre:../scripts/ota_auth.py
    post:../scripts/ota_quiet.py

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Units

; One firmware for both sides of this board: the unit's saved hostname says
; which it is (common/src/unit_identity.h), so it is built once and every
; unit of the board is flashed from that one build. Where it goes is only
; the upload port:
;   pio run -e p4 -t upload --upload-port COM3        # over USB
;   pio run -e p4 -t upload --upload-port port        # over WiFi, to SECRET_OTA_HOST_P4_PORT
;   pio run -e p4 -t upload --upload-port stbd        # over WiFi, to SECRET_OTA_HOST_P4_STBD
;   pio run -e p4 -t upload --upload-port <address>   # over WiFi (an IP or .local name)
; No env per side or per upload method: each would compile everything again
; (the build cache keys an object on its whole command line, and each env
; has its own library folder in it).
[env:p4]
upload_protocol = esptool
