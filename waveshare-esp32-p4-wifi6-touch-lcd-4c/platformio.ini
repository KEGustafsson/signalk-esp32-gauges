; Signal K steel gauges -- Waveshare ESP32-P4-WIFI6-Touch-LCD-4C (SKU 31522)
;
; 4" round 720x720 IPS (JD9365, 2-lane MIPI-DSI), GT911-compatible touch,
; ESP32-P4 (32 MB PSRAM, 32 MB flash) with an ESP32-C6 as its WiFi 6
; co-processor over SDIO (esp-hosted; Arduino's WiFi.h drives it).
;
; One environment per device; each builds that unit's side (its
; engine's pages) and uploads over the air to the address in
; ../include/secrets.h. The *_usb environments flash the same firmware over
; USB -- use them for the very first flash.
;
;   pio run -e p4_stbd -t upload      # 4" starboard (OTA)
;   pio run -e p4_port -t upload      # 4" port      (OTA)
;   pio run -e p4_stbd_usb -t upload  # first flash over USB

[platformio]
default_envs =
    p4_stbd
    p4_port
; Compiled objects, shared by every env and project in the repo (and by
; clean builds): a file is recompiled only when it or its flags change.
; Gitignored; CI points PLATFORMIO_BUILD_CACHE_DIR at the same place.
build_cache_dir = ../.pio-build-cache

[env]
; pioarduino 55.03.311 = Arduino-ESP32 3.3.11 (ESP-IDF 5.5), the core
; Waveshare's own Arduino examples for this board are built with.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; ESP32-P4 silicon v3.01+, which Waveshare's examples target by default
; (Arduino "Chip Variant: v3.00 or newer"). For an early board with pre-v3
; silicon use `board = esp32-p4` instead.
board = esp32-p4_r3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 32MB
board_build.partitions = partitions_32MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    ; SensESP from its main branch (unpinned, like drive-remote-controller):
    ; record the resolved revision from the build log when a build matters.
    https://github.com/SignalK/SensESP.git
    ; ESP-IDF 5 no longer bundles the WebSocket client SensESP needs.
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    lvgl/lvgl @ 9.3.0
    SignalKGauges=symlink://../common

build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    ; Use the ESP-IDF logging library - required by SensESP.
    -D USE_ESP_IDF_LOG
    -D BOARD_HAS_PSRAM
    ; Serial over the USB-C port's USB Serial/JTAG, as in Waveshare's
    ; Arduino setup (USB Mode: Hardware CDC and JTAG, CDC On Boot: Enabled).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL: lv_conf.h from this project's include/.
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; secrets.h (shared by both projects) lives in ../include.
    -I ../include
    ; The display/touch/backlight description is
    ; include/esp_panel_board_custom_conf.h (picked up automatically).
    ; LVGL draw buffer: 720 x 72 px (RGB565).
    -D LVGL_BUFFER_LINES=72

build_unflags =
    -Werror=reorder

; OTA password and target address from ../include/secrets.h.
extra_scripts =
    pre:../scripts/ota_auth.py
    post:../scripts/ota_quiet.py

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Units

[stbd]
build_flags =
    ${env.build_flags}
    -D GAUGE_SIDE=skgauges::Side::kStarboard
    -D GAUGE_HOSTNAME='"gauge-4c-stbd"'
    -D GAUGE_UNIT_NAME='"4in STBD"'
    -D GAUGE_ADDRESS=SECRET_OTA_HOST_P4_STBD

[port]
build_flags =
    ${env.build_flags}
    -D GAUGE_SIDE=skgauges::Side::kPort
    -D GAUGE_HOSTNAME='"gauge-4c-port"'
    -D GAUGE_UNIT_NAME='"4in PORT"'
    -D GAUGE_ADDRESS=SECRET_OTA_HOST_P4_PORT

; 4" starboard
[env:p4_stbd]
build_flags = ${stbd.build_flags}
upload_protocol = espota

; 4" port
[env:p4_port]
build_flags = ${port.build_flags}
upload_protocol = espota

[env:p4_stbd_usb]
build_flags = ${stbd.build_flags}
upload_protocol = esptool

[env:p4_port_usb]
build_flags = ${port.build_flags}
upload_protocol = esptool
