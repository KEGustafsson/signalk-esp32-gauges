; Signal K steel gauges -- Waveshare ESP32-S3-Touch-LCD-2.1 (SKU 28169)
;
; 2.1" round 480x480 IPS (ST7701, 16-bit RGB), CST820 touch, TCA9554 IO
; expander, ESP32-S3R8 (8 MB OPI PSRAM, 16 MB flash).
;
; One environment for the board, s3: both sides run the same firmware
; (see [env:s3] below). The first flash of a unit is over USB; after
; that, over WiFi.
;
;   pio run -e s3                                  # build
;   pio run -e s3 -t upload --upload-port COM4     # flash over USB
;   pio run -e s3 -t upload --upload-port port     # flash the 2.1" port unit over WiFi

[platformio]
default_envs = s3
; Compiled objects, shared by every env and project in the repo (and by
; clean builds): a file is recompiled only when it or its flags change.
; Gitignored; CI points PLATFORMIO_BUILD_CACHE_DIR at the same place.
build_cache_dir = ../.pio-build-cache
; This project's own PlatformIO packages (platform, toolchain, framework).
; custom_sdkconfig (below) rebuilds the Arduino framework's libraries in
; place; in the shared ~/.platformio the 4"'s next build reinstalled the
; stock ones, and the 2.1"'s next build rebuilt them again (about an hour
; each way). PLATFORMIO_CORE_DIR, if set, overrides it. Keep the path
; short: on Windows, generating the linker script passes every framework
; library's full path on one command line, and from inside the repo
; (../.pio-core-2.1in) it failed with "The command line is too long".
core_dir = ~/.pio21

[env]
; pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5), as the 4"
; (which needs its ESP-Hosted 2.12.13). Needs PlatformIO Core 6.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
; Two 6.25 MB app slots (OTA) and a 1 MB filesystem for SensESP's settings
; (partitions_16MB.csv: a smaller filesystem boots faster).
board_build.partitions = partitions_16MB.csv
; The panel's picture is copied out of PSRAM by an interrupt. Any flash
; access (a settings file read or written) cut the chip off from PSRAM and
; from that interrupt for a moment: a copy was missed and the picture
; stayed shifted up by one bounce buffer. Code and read-only data run from
; PSRAM, so flash access no longer stops PSRAM, and the RGB interrupt is
; kept in internal RAM (ESP-IDF's RGB LCD guide). The framework's libraries
; are rebuilt for this: the first build takes long.
;
; And the shift that stayed: the Arduino libraries enable
; CONFIG_LCD_RGB_RESTART_IN_VSYNC, and with it ESP-IDF's RGB driver (5.5,
; esp_lcd_panel_rgb.c) never resets the counter that picks which bounce
; buffer to refill. One late "buffer sent" interrupt (two merged into one)
; makes it refill the wrong buffer from then on: the picture shifted by one
; bounce buffer for good. With the option off (ESP-IDF's default), each
; VSYNC resets the counter and restarts the output if interrupts went
; missing: at worst one wrong frame.
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    ; SensESP from the maintainer's fork: SignalK/SensESP main plus the fixes
    ; these gauges need that are not upstream yet (fix/ws-message-reassembly:
    ; received WebSocket messages joined before parsing). Back to
    ; https://github.com/SignalK/SensESP.git once they are merged. Unpinned
    ; like upstream main: record the resolved revision from the build log
    ; when a build matters.
    https://github.com/KEGustafsson/SensESP.git#fix/ws-message-reassembly
    ; ESP-IDF 5 no longer bundles the WebSocket client SensESP needs.
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    lvgl/lvgl @ 9.3.0
    SignalKGauges=symlink://../common

build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    ; Use the ESP-IDF logging library - required by SensESP.
    -D USE_ESP_IDF_LOG
    -D BOARD_HAS_PSRAM
    ; Serial goes through the on-board CH343 USB-UART, not native USB.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; LVGL: lv_conf.h from this project's include/.
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; secrets.h (shared by both projects) lives in ../include.
    -I ../include
    ; ESP32_Display_Panel's built-in configuration for this exact board.
    -D ESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -D BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_2_1
    ; The LVGL draw buffer's size is set in src/main.cpp (a flag here would
    ; recompile everything when it changes).

build_unflags =
    -Werror=reorder

; OTA password and target address from ../include/secrets.h.
extra_scripts =
    pre:../scripts/fast_scons.py
    pre:../scripts/gauge_version.py
    pre:../scripts/ota_auth.py
    post:../scripts/ota_quiet.py

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Units

; One firmware for both sides of this board: the unit's saved hostname says
; which it is (common/src/unit_identity.h), so it is built once and every
; unit of the board is flashed from that one build. Where it goes is only
; the upload port:
;   pio run -e s3 -t upload --upload-port COM4        # over USB
;   pio run -e s3 -t upload --upload-port port        # over WiFi, to SECRET_OTA_HOST_S3_PORT
;   pio run -e s3 -t upload --upload-port stbd        # over WiFi, to SECRET_OTA_HOST_S3_STBD
;   pio run -e s3 -t upload --upload-port <address>   # over WiFi (an IP or .local name)
; No env per side or per upload method: each would compile everything again
; (the build cache keys an object on its whole command line, and each env
; has its own library folder in it).
[env:s3]
upload_protocol = esptool
