; Signal K steel gauges -- Waveshare ESP32-S3-Touch-LCD-2.1 (SKU 28169)
;
; 2.1" round 480x480 IPS (ST7701, 16-bit RGB), CST820 touch, TCA9554 IO
; expander, ESP32-S3R8 (8 MB OPI PSRAM, 16 MB flash).
;
; One environment per physical unit; each builds that unit's side (its
; engine's pages) and uploads over the air to the address in
; ../include/secrets.h. The *_usb environments flash the same firmware over
; the USB-C port (CH343 UART) -- use them for the very first flash.
;
;   pio run -e s3_stbd -t upload      # 2.1" #1, starboard (OTA)
;   pio run -e s3_port -t upload      # 2.1" #2, port      (OTA)
;   pio run -e s3_stbd_usb -t upload  # first flash over USB

[platformio]
default_envs =
    s3_stbd
    s3_port

[env]
; pioarduino 55.03.311 = Arduino-ESP32 3.3.11 (ESP-IDF 5.5), the core
; Waveshare's own Arduino examples for these boards are built with.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Two 6.25 MB app slots (OTA) and a filesystem for SensESP's configuration.
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    ; SensESP from its main branch (unpinned, like drive-remote-controller):
    ; record the resolved revision from the build log when a build matters.
    https://github.com/SignalK/SensESP.git
    ; ESP-IDF 5 no longer bundles the WebSocket client SensESP needs.
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    lvgl/lvgl @ 9.3.0
    SignalKGauges=symlink://../common

build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    ; Use the ESP-IDF logging library - required by SensESP.
    -D USE_ESP_IDF_LOG
    -D BOARD_HAS_PSRAM
    ; Serial goes through the on-board CH343 USB-UART, not native USB.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; LVGL: lv_conf.h from this project's include/.
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; secrets.h (shared by both projects) lives in ../include.
    -I ../include
    ; ESP32_Display_Panel's built-in configuration for this exact board.
    -D ESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -D BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_2_1
    ; LVGL draw buffer: 480 x 40 px (RGB565), internal RAM preferred.
    -D LVGL_BUFFER_LINES=40

build_unflags =
    -Werror=reorder

; OTA password and target address from ../include/secrets.h.
extra_scripts = pre:../scripts/ota_auth.py

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Units

[stbd]
build_flags =
    ${env.build_flags}
    -D GAUGE_SIDE=skgauges::Side::kStarboard
    -D GAUGE_HOSTNAME='"gauge-21-stbd"'
    -D GAUGE_UNIT_NAME='"2.1in STBD"'
    -D GAUGE_ADDRESS=SECRET_OTA_HOST_S3_STBD

[port]
build_flags =
    ${env.build_flags}
    -D GAUGE_SIDE=skgauges::Side::kPort
    -D GAUGE_HOSTNAME='"gauge-21-port"'
    -D GAUGE_UNIT_NAME='"2.1in PORT"'
    -D GAUGE_ADDRESS=SECRET_OTA_HOST_S3_PORT

; 2.1" #1 -- starboard
[env:s3_stbd]
build_flags = ${stbd.build_flags}
upload_protocol = espota

; 2.1" #2 -- port
[env:s3_port]
build_flags = ${port.build_flags}
upload_protocol = espota

[env:s3_stbd_usb]
build_flags = ${stbd.build_flags}
upload_protocol = esptool

[env:s3_port_usb]
build_flags = ${port.build_flags}
upload_protocol = esptool
