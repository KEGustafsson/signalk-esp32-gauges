; One-off: updates the 4" board's ESP32-C6 WiFi co-processor to the
; ESP-Hosted firmware the P4's Arduino core expects (README.md).
;
;   cd tools/c6-update && pio run -t upload && pio device monitor
;
; Then flash the gauge firmware again (docs/BRINGUP.md).

[platformio]
; Shared with the board projects (gitignored).
build_cache_dir = ../../.pio-build-cache

[env:c6_update]
; Same platform and board as waveshare-esp32-p4-wifi6-touch-lcd-4c.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-p4_r3
board_build.flash_mode = qio
board_upload.flash_size = 32MB
monitor_speed = 115200
upload_speed = 921600
; Serial is the UART on the USB-C port next to the CH343 (no CDC on boot).
build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    ; The boat's WiFi from ../../include/secrets.h (or the example).
    -I ../../include
    -I ../../common/src
